<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quizzal | Interactive Learning Platform for Students</title>

    <meta name="description" content="Quizzal is an interactive learning platform where students can practice quizzes in Mathematics, Biology, Chemistry, Physics, English, Geography, History and Computer Science while tracking their progress.">

    <meta name="keywords" content="Quizzal, quizzes, education, mathematics, biology, chemistry, physics, geography, history, English, computer science, online learning">

    <meta name="author" content="Quizzal">

    <link rel="icon" type="image/png" href="images/9.png">

    <!-- Open Graph -->
    <meta property="og:title" content="Quizzal | Interactive Learning Platform">
    <meta property="og:description" content="Practice quizzes, earn XP, unlock achievements, and improve your knowledge with Quizzal.">
    <meta property="og:image" content="https://prince-1234-ops.github.io/quizzal/images/9.png">
    <meta property="og:url" content="https://prince-1234-ops.github.io/quizzal/">
    <meta property="og:type" content="website">

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Quizzal | Interactive Learning Platform">
    <meta name="twitter:description" content="Practice quizzes and track your learning progress with Quizzal.">
    <meta name="twitter:image" content="https://prince-1234-ops.github.io/quizzal/images/9.png">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"WebSite",
      "name":"Quizzal",
      "url":"https://prince-1234-ops.github.io/quizzal/",
      "description":"Interactive learning platform with quizzes for students."
    }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<a href="#" class="logo">Quizzal</a>

<nav>

<a href="login.html">Home</a>
<a href="abaut.html">About</a>
<a href="contact.html">Contact</a>
<a href="#" class="active">Login</a>

</nav>

</header>

<section class="hero">

<div class="container">

    <div class="form-box login">
        <h1>Login</h1>

            <form id="loginForm">
            <div class="input-box">
                <i class='bx bx-envelope'></i>
                <input type="email" id="email" required>
                <label>Email</label>
            </div>

            <div class="input-box">
                <i class='bx bx-lock'></i>
                <input type="password" id="password" required>
                <label>Password</label>
            </div>

 
              <button type="submit">Login</button>


               

            <p class="switch">
                Don't have an account?
                <a onclick="register()">Register</a>
            </p>

        </form>
    </div>


    <div class="form-box register">

        <h1>Register</h1>

        <form>

            <div class="input-box">
                <i class='bx bx-user'></i>
                <input type="text" required>
                <label>Username</label>
            </div>

            <div class="input-box">
                <i class='bx bx-envelope'></i>
                <input type="email" id="email" required>
                <label>Email</label>
            </div>

            <div class="input-box">
                <i class='bx bx-lock'></i>
                <input type="password" required>
                <label>Password</label>
            </div>

            <button>Create Account</button>

            <p class="switch">
                Already have an account?
                <a onclick="login()">Login</a>
            </p>

        </form>

    </div>


    <div class="info-panel">

        <h2>Welcome to Quizzal</h2>

        <p>
            Test your knowledge.
            Learn. Compete. Improve.
        </p>

    </div>

</div>
</section>
<canvas id="particles"></canvas>

<div class="mouse-glow"></div>

<script>
const container = document.querySelector(".container");

function register() {
    container.classList.add("active");
}

function login() {
    container.classList.remove("active");
}
</script>

<script>
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("email").value;

    localStorage.setItem("userEmail", email);
    localStorage.setItem("currentUser", email);
    window.location.href = "dashboard.html";

});
</script>
</body>
</html>
